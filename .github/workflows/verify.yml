name: Verify
on: [push, pull_request]
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: dotnet test backend/tests/BqAtlas.Tests
      - run: npm test --prefix frontend
      - run: node scripts/pack.mjs
      - run: node scripts/verify-packages.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/npm/*.tgz
            artifacts/nuget/*.nupkg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-verification-evidence
          path: |
            artifacts/release-manifest.json
            artifacts/verify-*/verification.json
            artifacts/verify-*/regeneration-preview.json
  databases:
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgresql, sqlserver]
    services:
      postgres:
        image: postgres:18.4-trixie
        env:
          POSTGRES_PASSWORD: bqatlas-ci-only
        ports: ['25432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: BqAtlas-CI-only!123
        ports: ['21433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'BqAtlas-CI-only!123' -Q 'SELECT 1'"
          --health-interval 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - run: dotnet test backend/tests/BqAtlas.IntegrationTests --logger trx --results-directory artifacts/database-tests
        env:
          BQATLAS_TEST_PROVIDER: ${{ matrix.database }}
          BQATLAS_TEST_CONNECTION: ${{ matrix.database == 'postgresql' && 'Host=localhost;Port=25432;Database=postgres;Username=postgres;Password=bqatlas-ci-only' || 'Server=localhost,21433;Database=master;User Id=sa;Password=BqAtlas-CI-only!123;TrustServerCertificate=true' }}
      - run: node scripts/verify-generated-resource.mjs
        env:
          BQATLAS_TEST_PROVIDER: ${{ matrix.database }}
          BQATLAS_TEST_CONNECTION: ${{ matrix.database == 'postgresql' && 'Host=localhost;Port=25432;Database=postgres;Username=postgres;Password=bqatlas-ci-only' || 'Server=localhost,21433;Database=master;User Id=sa;Password=BqAtlas-CI-only!123;TrustServerCertificate=true' }}
      - run: node scripts/verify-starter-runtime.mjs
        env:
          BQATLAS_TEST_PROVIDER: ${{ matrix.database }}
          BQATLAS_TEST_CONNECTION: ${{ matrix.database == 'postgresql' && 'Host=localhost;Port=25432;Database=postgres;Username=postgres;Password=bqatlas-ci-only' || 'Server=localhost,21433;Database=master;User Id=sa;Password=BqAtlas-CI-only!123;TrustServerCertificate=true' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-evidence-${{ matrix.database }}
          path: |
            artifacts/database-tests/*.trx
            artifacts/resource-runtime-*/results/*.trx
            artifacts/resource-runtime-*/verification.json
            artifacts/starter-runtime-*/results/*.trx
            artifacts/starter-runtime-*/verification.json
            artifacts/starter-runtime-*/database-lifecycle.json
